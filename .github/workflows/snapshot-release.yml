name: Snapshot Pre-Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".github/workflows/manual-release.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Build, Tag, and Publish Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Snapshot Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          LATEST_OFFICIAL_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          if [ -n "$LATEST_OFFICIAL_TAG" ]; then
            BASE_VERSION="${LATEST_OFFICIAL_TAG#v}"
          elif [ -f "VERSION" ]; then
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]' | sed 's/^v//' | cut -d'-' -f1)
          else
            BASE_VERSION="1.0.0"
          fi

          SNAPSHOT_TAG="v${BASE_VERSION}-snapshot.${SHORT_SHA}"
          echo "snapshot_tag=$SNAPSHOT_TAG" >> "$GITHUB_OUTPUT"
          echo "[info] Computed snapshot tag: $SNAPSHOT_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Snapshot Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.snapshot_tag }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Publish GitHub Snapshot Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.snapshot_tag }}
          name: "Snapshot: ${{ steps.meta.outputs.snapshot_tag }}"
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Side-Effect: Dispatch to PPL SIAP Deployment Repo
      # ---------------------------------------------------------
      - name: Dispatch Dev/Preview Deployment
        env:
          DEPLOY_REPOSITORY: ${{ vars.DEPLOYMENT_REPO || 'Churma16/ppl-siap-deployment' }}
          DEPLOY_ACCESS_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        if: ${{ env.DEPLOY_ACCESS_TOKEN != '' }}
        run: |
          echo "[info] Dispatching snapshot-deployed event to $DEPLOY_REPOSITORY..."
          curl -s -o /dev/null -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_ACCESS_TOKEN" \
            "https://api.github.com/repos/$DEPLOY_REPOSITORY/dispatches" \
            -d "{\"event_type\": \"snapshot-deployed\", \"client_payload\": {\"tag\": \"${{ steps.meta.outputs.snapshot_tag }}\", \"sha\": \"${{ steps.meta.outputs.short_sha }}\", \"branch\": \"${{ github.ref_name }}\"}}"
