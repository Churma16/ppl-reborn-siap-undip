version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/app
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-ppl_reborn}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
    depends_on:
      - db
    networks:
      - laravel
    command: >
      sh -c "composer install &&
             if [ ! -f .env ]; then cp .env.example .env; fi &&
             php artisan key:generate &&
             until mysqladmin ping -h db --silent; do
               echo 'Waiting for database connection...'
               sleep 2
             done &&
             php artisan migrate &&
             php artisan serve --host=0.0.0.0 --port=8000"



  db:
    image: mysql:8.0
    restart: always
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ppl_reborn}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
